# Enable AndroidX artifacts
android.useAndroidX=true
# Enable Jetifier to rewrite support libraries to AndroidX if needed
android.enableJetifier=true

# Gradle daemon JVM args - increase heap and tune GC to reduce thrashing
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel workers
org.gradle.parallel=true
org.gradle.workers.max=4

# Configure Kotlin to use incremental compilation
kotlin.incremental=true
